name: Site CI

on:
    push:
        branches: [main]
        paths:
            - "projects/01-static-site/**"
            - ".github/workflows/site-ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "projects/01-static-site/**"
            - ".github/workflows/site-ci.yml"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            
            - name: Build Site image
              uses: docker/build-push-action@v6
              with:
                context: projects/01-static-site
                file: projects/01-static-site/Dockerfile
                push: false
                tags: |
                    static-site:${{ github.sha }}
                    static-site:latest
