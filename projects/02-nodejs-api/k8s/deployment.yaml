apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
  labels: 
    app: node-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
    spec:
      containers:
      - name: api
        image: node-api:semana4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: MESSAGE
          value: "API no Kubernetes"
